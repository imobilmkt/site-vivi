<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Search homes and condos for sale in South Florida with Viviane DaSilva — in English, Português and Español.">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="search">

<header class="site-header"></header>

<main class="ps">
  <h1 class="sr-only" data-i18n="ps.title">Property Search</h1>
  <form class="ps-bar" data-ps-form role="search" data-i18n-aria="ps.title">
    <label class="ps-q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="sr-only" data-i18n="ps.ph">City, neighborhood, building or ZIP</span>
      <input name="q" type="search" list="search-suggest" autocomplete="off" enterkeyhint="search" data-i18n-ph="ps.ph" placeholder="City, neighborhood, building or ZIP">
    </label>
    <datalist id="search-suggest"></datalist>
    <select name="type" data-i18n-aria="search.label">
      <option value="sale" data-i18n="search.sale">For sale</option>
      <option value="rent" data-i18n="search.rent">For rent</option>
      <option value="sold" data-i18n="search.sold">Sold</option>
    </select>
    <select name="min" data-i18n-aria="ps.min">
      <option value="" data-i18n="ps.min">Min price</option>
      <option value="500000">$500K</option><option value="1000000">$1M</option><option value="2000000">$2M</option>
      <option value="3000000">$3M</option><option value="5000000">$5M</option><option value="10000000">$10M</option>
    </select>
    <select name="max" data-i18n-aria="ps.max">
      <option value="" data-i18n="ps.max">Max price</option>
      <option value="1000000">$1M</option><option value="2000000">$2M</option><option value="3000000">$3M</option>
      <option value="5000000">$5M</option><option value="10000000">$10M</option><option value="20000000">$20M</option>
    </select>
    <select name="beds" data-i18n-aria="ps.beds">
      <option value="" data-i18n="ps.beds">Beds</option>
      <option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option><option value="5">5+</option>
    </select>
    <select name="baths" data-i18n-aria="ps.baths">
      <option value="" data-i18n="ps.baths">Baths</option>
      <option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option><option value="5">5+</option>
    </select>
    <button class="btn btn--solid ps-go" type="submit" data-i18n="search.submit">Search</button>
    <div class="ps-views" role="group" data-i18n-aria="ps.views">
      <button type="button" data-view-btn="list" data-i18n="ps.view.list">List</button>
      <button type="button" data-view-btn="mixed" data-i18n="ps.view.mixed">Mixed</button>
      <button type="button" data-view-btn="map" data-i18n="ps.view.map">Map</button>
    </div>
  </form>

  <div class="ps-main" data-view="mixed">
    <section class="ps-list" aria-live="polite">
      <div class="ps-head">
        <p class="ps-count" id="ps-count"></p>
        <label class="ps-sort"><span class="sr-only" data-i18n="ps.sort">Sort</span>
          <select data-ps-sort>
            <option value="" data-i18n="ps.sort.default">Default</option>
            <option value="desc" data-i18n="ps.sort.desc">Price: high to low</option>
            <option value="asc" data-i18n="ps.sort.asc">Price: low to high</option>
          </select>
        </label>
      </div>
      <div class="ps-table" role="table">
        <div class="ps-row ps-row--head" role="row">
          <span role="columnheader" data-i18n="ps.col.image">Image</span>
          <span role="columnheader" data-i18n="ps.col.address">Address</span>
          <span role="columnheader" data-i18n="ps.col.price">Price</span>
          <span role="columnheader" data-i18n="ps.col.beds">Beds</span>
          <span role="columnheader" data-i18n="ps.col.baths">Baths</span>
          <span role="columnheader">Sq ft</span>
          <span role="columnheader" data-i18n="ps.col.status">Status</span>
          <span role="columnheader" data-i18n="ps.col.source">Source</span>
          <span role="columnheader"><span class="sr-only" data-i18n="ps.save">Save</span></span>
        </div>
        <div id="ps-rows" role="rowgroup"></div>
      </div>
      <p class="ps-note fine" id="ps-note"></p>
    </section>
    <div class="ps-map" id="ps-map" aria-label="Map"></div>
  </div>
</main>

<footer class="site-footer"></footer>
