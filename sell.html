<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sell Your Home — Viviane DaSilva · South Florida</title>
  <meta name="description" content="Sell your South Florida home with Viviane DaSilva: accurate valuation, considered presentation and a discreet process — in English, Português and Español.">
  <meta name="theme-color" content="#FAF9F6">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="sell">

<header class="site-header"></header>

<main data-wa-msg="wa.msg.sell">
  <section class="page container sell-hero">
    <div class="reveal">
      <p class="label" data-i18n="sell.label">Sell with Viviane</p>
      <h1 class="h1" data-i18n-html="sell.title"></h1>
      <p class="lede" data-i18n="sell.text"></p>
      <div class="sell-actions">
        <a class="btn btn--solid" data-tel-link href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5h3l1.5 4-2 1.3a11 11 0 0 0 6.1 6.1l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span data-tel-text></span>
        </a>
        <a class="btn" data-wa href="#" target="_blank" rel="noopener" data-i18n="sell.wa">Message on WhatsApp</a>
      </div>
    </div>
    <figure class="arch sell-hero__img reveal"><img src="assets/img/st-regis-sunny-isles/living.webp" alt="" fetchpriority="high"></figure>
  </section>

  <section class="band band--cream">
    <div class="container">
      <p class="label reveal" data-i18n="sell.steps">The process</p>
      <ul class="steps reveal">
        <li><span class="n">01</span><h3 data-i18n="sell.1.t"></h3><p data-i18n="sell.1.d"></p></li>
        <li><span class="n">02</span><h3 data-i18n="sell.2.t"></h3><p data-i18n="sell.2.d"></p></li>
        <li><span class="n">03</span><h3 data-i18n="sell.3.t"></h3><p data-i18n="sell.3.d"></p></li>
      </ul>
    </div>
  </section>

  <section class="section container">
    <div class="contact">
      <div class="reveal">
        <p class="label" data-i18n="sell.form.label">Request a valuation</p>
        <h2 class="h2" data-i18n-html="sell.form.title"></h2>
        <p data-i18n="sell.form.text"></p>
        <div class="contact-lines">
          <a data-tel href="#"></a>
          <a data-mail href="#"></a>
          <a data-wa href="#" target="_blank" rel="noopener">WhatsApp</a>
        </div>
      </div>
      <form class="contact-form reveal" data-form="sell" novalidate>
        <div class="form-fields">
          <label class="field"><span data-i18n="form.address">Property address</span><input name="address" required autocomplete="street-address"></label>
          <div class="row">
            <label class="field"><span data-i18n="form.ptype">Property type</span>
              <select name="type">
                <option data-i18n="form.opt.condo">Condo</option>
                <option data-i18n="form.opt.house">Single-family home</option>
                <option data-i18n="form.opt.town">Townhouse</option>
                <option data-i18n="form.opt.land">Land</option>
              </select>
            </label>
            <label class="field"><span data-i18n="form.timeline">Timeline</span>
              <select name="timeline">
                <option data-i18n="form.opt.now">Ready now</option>
                <option data-i18n="form.opt.6m">Within 6 months</option>
                <option data-i18n="form.opt.12m">Within 12 months</option>
                <option data-i18n="form.opt.explore">Just exploring</option>
              </select>
            </label>
          </div>
          <label class="field"><span data-i18n="form.name">Full name</span><input name="name" required autocomplete="name"></label>
          <div class="row">
            <label class="field"><span data-i18n="form.email">Email</span><input name="email" type="email" required autocomplete="email"></label>
            <label class="field"><span data-i18n="form.phone">Phone / WhatsApp</span><input name="phone" type="tel" autocomplete="tel"></label>
          </div>
          <label class="field"><span data-i18n="form.message">Message</span><textarea name="message" rows="3"></textarea></label>
          <button class="btn btn--solid" type="submit" data-i18n="sell.submit">Request valuation</button>
        </div>
        <p class="form-ok" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <a class="wa" data-wa href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2a9.9 9.9 0 0 0-8.5 15l-1.5 5 5.1-1.4A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3a8.2 8.2 0 1 1 6.9 3.8Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
  </a>
</main>

<footer class="site-footer"></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/listings.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
