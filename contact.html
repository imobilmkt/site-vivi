<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact — Viviane DaSilva · Real Estate Advisor</title>
  <meta name="description" content="Private consultations with Viviane DaSilva, in person in Miami or by video — in English, Português and Español.">
  <meta name="theme-color" content="#FAF9F6">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">

<header class="site-header"></header>

<main>
  <section class="page container">
    <div class="contact">
      <div class="reveal">
        <p class="label" data-i18n="contact.label">Contact</p>
        <h1 class="h1" data-i18n-html="contact.title"></h1>
        <p data-i18n="contact.text"></p>
        <div class="contact-lines">
          <a data-tel href="#"></a>
          <a data-mail href="#"></a>
          <a data-wa href="#" target="_blank" rel="noopener">WhatsApp</a>
        </div>
        <p class="label contact-follow" data-i18n="contact.follow">Follow</p>
        <div class="tb-social contact-social">
          <a class="tb-icon" data-social="linkedin" href="#" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5.3 8.9h2.9V19H5.3zM6.8 4.5a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4ZM10.1 8.9h2.8v1.4c.4-.8 1.4-1.6 2.9-1.6 3 0 3.6 2 3.6 4.6V19h-2.9v-5c0-1.2 0-2.7-1.7-2.7s-1.9 1.3-1.9 2.6V19h-2.8z"/></svg></a>
          <a class="tb-icon" data-social="instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></svg></a>
          <a class="tb-icon" data-wa href="#" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2a9.9 9.9 0 0 0-8.5 15l-1.5 5 5.1-1.4A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3a8.2 8.2 0 1 1 6.9 3.8Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg></a>
        </div>
      </div>
      <form class="contact-form reveal" data-form="contact" novalidate>
        <div class="form-fields">
          <label class="field"><span data-i18n="form.name">Full name</span><input name="name" required autocomplete="name"></label>
          <div class="row">
            <label class="field"><span data-i18n="form.email">Email</span><input name="email" type="email" required autocomplete="email"></label>
            <label class="field"><span data-i18n="form.phone">Phone / WhatsApp</span><input name="phone" type="tel" autocomplete="tel"></label>
          </div>
          <label class="field"><span data-i18n="form.interest">I am interested in</span>
            <select name="interest">
              <option data-i18n="form.opt.buy">Buying</option>
              <option data-i18n="form.opt.sell">Selling</option>
              <option data-i18n="form.opt.invest">Investing</option>
              <option data-i18n="form.opt.relocate">Relocating</option>
            </select>
          </label>
          <label class="field"><span data-i18n="form.message">Message</span><textarea name="message" rows="4"></textarea></label>
          <button class="btn btn--solid" type="submit" data-i18n="form.submit">Send request</button>
        </div>
        <p class="form-ok" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer"></footer>

<a class="wa" data-wa href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2a9.9 9.9 0 0 0-8.5 15l-1.5 5 5.1-1.4A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3a8.2 8.2 0 1 1 6.9 3.8Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
</a>

</html>
